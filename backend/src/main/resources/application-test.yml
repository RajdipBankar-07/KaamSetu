server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: jdbc:h2:mem:kaamsetu_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        type:
          preferred_uuid_jdbc_type: CHAR

kaamsetu:
  auth:
    mock-mode: false
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 3600000 # 1 hour for test
    refresh-expiration-ms: 86400000
  otp:
    expiration-seconds: 300
    resend-cooldown-seconds: 60
    max-verification-attempts: 5
    rate-limit-per-hour: 10
  email:
    verification-expiration-hours: 24
  cors:
    allowed-origins:
      - "*"
