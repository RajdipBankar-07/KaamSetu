name: 🌾 KaamSetu CI/CD Production Pipeline

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Build & Verify Backend
  # ----------------------------------------------------------------------------
  backend-test-and-build:
    name: ☕ Backend Maven Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        working-directory: ./backend
        run: mvn clean verify -B

  # ----------------------------------------------------------------------------
  # Stage 2: Verify Frontend PWA & Static Quality
  # ----------------------------------------------------------------------------
  frontend-verify:
    name: 📱 Frontend PWA Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate JSON Files
        run: |
          python3 -c "import json; json.load(open('manifest.json'))"
          echo "✅ manifest.json is valid"

  # ----------------------------------------------------------------------------
  # Stage 3: Docker Container Packaging & Security Scanning
  # ----------------------------------------------------------------------------
  docker-build-and-push:
    name: 🐳 Docker Build & Container Scan
    needs: [backend-test-and-build, frontend-verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: kaamsetu/backend-api:${{ github.sha }}

      - name: Build Frontend PWA Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: kaamsetu/frontend-pwa:${{ github.sha }}
